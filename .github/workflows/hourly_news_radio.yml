name: Auto Update News Radio MP3

on:
  schedule:
    - cron: '0 22,0,2,4,6,8,10,12,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-radio-mp3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          pip install edge-tts
      - name: Build MP3
        run: python3 build_hourly_news_radio_mp3.py
      - name: Push MP3
        run: |
          git config user.name "evening-soxx"
          git config user.email "evening-soxx@users.noreply.github.com"
          git add latest_news_radio.mp3 latest_news_radio.json
          git diff --staged --quiet || (git commit -m "auto: update news radio" && git push)
